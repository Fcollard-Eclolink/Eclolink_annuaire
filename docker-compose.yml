services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER    : eclolink
      POSTGRES_PASSWORD: eclolink
      POSTGRES_DB      : eclolink
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test    : ["CMD-SHELL", "pg_isready -U eclolink -d eclolink"]
      interval: 10s
      timeout : 5s
      retries : 5

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - NUXT_DATABASE_URL=postgres://eclolink:eclolink@db:5432/eclolink
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
